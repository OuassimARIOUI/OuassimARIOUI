# Genere l'animation "snake" a partir de la grille de contributions GitHub,
# puis la publie sur la branche `output` (affichee dans le README).
name: Generate Snake

on:
  # toutes les 12 heures
  schedule:
    - cron: "0 */12 * * *"
  # lancement manuel depuis l'onglet Actions
  workflow_dispatch:
  # a chaque push sur main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generer les SVG du serpent
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#2F6FED&color_dots=#ebedf0,#d9c8f7,#b996f0,#8f63e0,#6a3fc2
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#70A5FD&color_dots=#161b22,#3b2a6b,#5b3fa3,#8259d6,#bf91f3

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
